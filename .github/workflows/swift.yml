name: Swift
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: echo "IOS_DESTINATION=$(python3 scripts/ci-simulator.py)" >> "$GITHUB_ENV"
      - name: Build and test iOS app without signing
        run: |
          set -o pipefail
          xcodebuild -project packages/ios-app/APP.xcodeproj -scheme APP \
            -destination "$IOS_DESTINATION" CODE_SIGNING_ALLOWED=NO build test
